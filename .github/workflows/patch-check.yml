name: Check VALORANT Patch Notes

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valorant-patch-note-bot
  cancel-in-progress: true

jobs:
  check-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run patch checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit latest patch data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add latest_patch.json
          git commit -m "Update latest patch note" || echo "No changes to commit"
          git push
